# Security Scan of the application 
# GitLeak, Sonarqube and trivy fs scan
# Build of the docker image
# Trivy image scan
# Upload of the image as an artifact with cosign
# Set runID

name: Security checks
on:
  workflow_call:
    inputs:
      DOCKER_IMAGE:
        description: 'path of the docker image'
        type: string
        required: true
    secrets:
      SONAR_TOKEN:
        required: true
      COSIGN_PRIVATE_KEY:
        required: true
      COSIGN_PASSWORD:
        required: true
    outputs:
      run_id:
        description: 'Run ID where the artifact was uploaded'
        value: ${{ github.run_id }}

permissions:
  contents: read

jobs:
  security_checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore Pipenv environment
        uses: actions/cache@v4
        with:
          path: ~/.local/share/virtualenvs
          key: ${{ runner.os }}-pipenv-${{ hashFiles('**/Pipfile.lock') }}
 
      - name: Run Gitleaks (Secret Scanning)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true 
  
      - name: Analyze with SonarCloud
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}   
        with:
          args:
            -Dsonar.organization=titou-onee
            -Dsonar.projectKey=Titou-Onee_CloudDevOps_ecommerce
          projectBaseDir: .
          
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: 'fs'
          scan-ref: '.'
          trivy-config: trivy.yaml
          format: 'sarif'
          output: 'trivy-fs-results.sarif'
          # In  the context of this project, we can accept to continue on error 
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Build Docker image
        run: |
          docker build -t ${{ inputs.DOCKER_IMAGE }}:ci-signed ./Docker


      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: '${{ inputs.DOCKER_IMAGE }}:ci-signed'
          format: 'template'
          template: '@/contrib/sarif.tpl'
          output: 'trivy-image-results.sarif'
          severity: 'CRITICAL,HIGH'
      
      - name: Save Docker image
        run: docker save ${{ inputs.DOCKER_IMAGE }}:ci-signed -o image.tar

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6

      - name: Sign with Cosign
        run: |
          cosign sign-blob --yes --key env://COSIGN_PRIVATE_KEY --output-signature image.tar.sig --output-certificate image.tar.pem --bundle image.tar.bundle image.tar 
        env:
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_EXPERIMENTAL: "true"

      # Use of Artifacts for learning purpose
      - name: Upload image as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: signed-docker-image
          path: |
            image.tar
            image.tar.sig
            image.tar.bundle
          retention-days: 1

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: |
            trivy-image-results.sarif
            trivy-fs-results.sarif
          retention-days: 1
     
      - name: Set run ID output
        id: set_run_id
        run: echo "RUN_ID_OUTPUT=${{ github.run_id}}" >> $GITHUB_OUTPUT
  

      
