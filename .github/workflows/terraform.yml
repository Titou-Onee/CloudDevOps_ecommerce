# Worflow for terraform checks
# Terraform init, plan, format, validate
# TFlint verification
# Infracost check
# Checkov and TFsec scan
name: Terraform
on:
  push:
    branches:
      - master
      - dev
    paths:
      - 'terraform/**'

permissions:
  contents: read
  
jobs:
  terraform:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: eu-west-3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
            terraform_version: 1.13.1

      - name: Terraform format
        run: terraform fmt --check -recursive
        working-directory: terraform/infra
        continue-on-error: true

      - name: Terraform validation
        run: terraform validate
        working-directory: terraform/infra
        continue-on-error: true
      
      - name: Setup TFlint
        uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a
        with:
          tflint_version: v0.60.0

      - name: Run TFlint
        run: tflint --recursive
        working-directory: terraform/infra
        continue-on-error: true
      
      - name: Create reports directory
        run: mkdir -p terraform/infra/reports

      - name: Setup Infracost
        uses: infracost/actions/setup@fb736a8f219195d6efdca58682069b16fe1bc280
        with: 
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      - name: Generate Infracost breakdown
        run: |
          infracost breakdown --path=terraform/infra \
                              --format=table \
                              --show-skipped
      
      - name: Generate Infracost txt output
        run: |
          infracost breakdown --path=terraform/infra \
                              --format=table \
                              --out-file=terraform/infra/reports/infracost-report.txt

      - name: TFsec scan
        uses: aquasecurity/tfsec-action@b466648d6e39e7c75324f25d83891162a721f2d6
        with:
          working_directory: terraform/infra 
          additional_args: >
            --format text
            --concise-output
            --out terraform/infra/reports/tfsec-report.txt
        continue-on-error: true

      - name: Setup Python for Checkov
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.x'

      - name: Install Checkov
        run: pip install checkov
        
      - name: Checkov scan
        run: |
          checkov -d terraform/infra \
                  --framework terraform \
                  --output cli \
                  --output-file-path terraform/infra/reports/checkov-report.txt \
                  --quiet \
                  --compact
        continue-on-error: true

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: terraform-security-report
          path: terraform/infra/reports/
          retention-days: 1